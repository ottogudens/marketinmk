[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python3.11 -m venv /app/.venv",
  "/app/.venv/bin/pip install --upgrade pip",
  "/app/.venv/bin/pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd backend && /app/.venv/bin/python manage.py collectstatic --noinput"
]

[start]
cmd = "cd backend && /app/.venv/bin/gunicorn config.wsgi --workers 4 --bind 0.0.0.0:$PORT --timeout 120"
